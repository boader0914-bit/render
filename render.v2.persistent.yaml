services:
  - type: web
    name: glamping-datalab-v2
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build:ui
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: glamping-datalab-v2-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: OUTPUTS_DIR
        value: /var/data/outputs
      - key: CONFIG_DIR
        value: /var/data/config
      - key: V2_UI_V3_ENABLED
        value: "false"
      - key: V2_INTEGRATION_AUTH_ENABLED
        value: "false"
      - key: V2_INTEGRATION_PLATFORM_CORE_ENABLED
        value: "false"
      - key: V2_INTEGRATION_FRESH_COMPANY_ENABLED
        value: "false"
      - key: V2_INTEGRATION_FRESH_OBSERVATION_ENABLED
        value: "false"
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_SEARCHAD_API_KEY
        sync: false
      - key: NAVER_SEARCHAD_SECRET_KEY
        sync: false
      - key: NAVER_SEARCHAD_CUSTOMER_ID
        sync: false

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1457c7">
  <title>숙박업 데이터랩 beta</title>
  <style>
    :root { color-scheme: dark; font-family: "Pretendard Variable", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0c1016; color: #f8fbff; }
    main { width: min(100%, 460px); display: grid; gap: 16px; padding: 28px; border: 1px solid rgba(106, 168, 255, .24); border-radius: 24px; background: #121823; box-shadow: 0 24px 70px rgba(0, 0, 0, .34); }
    span { width: max-content; padding: 6px 12px; border: 1px solid rgba(94, 234, 212, .40); border-radius: 999px; color: #dffeff; font-size: 12px; font-weight: 900; text-transform: uppercase; }
    h1 { margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: 0; }
    p { margin: 0; color: #b8c4d6; font-size: 15px; font-weight: 750; line-height: 1.65; }
    a { min-height: 50px; display: inline-grid; place-items: center; border-radius: 15px; background: #3182f6; color: #fff; font-weight: 950; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span>beta</span>
    <h1>연결을 확인해주세요</h1>
    <p>리포트와 검색 상태는 서버 연결이 필요합니다. 네트워크가 복구되면 다시 열어주세요.</p>
    <a href="/b2b">다시 열기</a>
  </main>
</body>
</html>

<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#087e68" />
    <meta name="application-name" content="숙박 데이터랩" />
    <meta name="apple-mobile-web-app-title" content="숙박 데이터랩" />
    <meta name="csrf-token" content="" />
    <meta name="lodging-v2-platform-core-enabled" content="__V2_PLATFORM_CORE_ENABLED__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <script src="/theme-boot.js"></script>
    <title>숙박 데이터랩</title>
  </head>
  <body data-v2-ui="v3">
    <a class="v2-skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div id="root" data-v2-ui-root>
      <noscript>
        <main>
          <h1>숙박 데이터랩 로그인</h1>
          <p>JavaScript를 사용할 수 없어 안전한 서버 로그인 양식을 표시합니다.</p>
          <form action="/login" method="post">
            <label>아이디 또는 이메일 <input name="username" autocomplete="username" required /></label>
            <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required /></label>
            <button type="submit">로그인</button>
          </form>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

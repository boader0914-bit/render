# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Proposal only. Do not sync before Approval D.
services:
  - type: worker
    name: datalab-v4-canary-dry-run
    runtime: node
    repo: https://github.com/boader0914-bit/render
    branch: recovery/v4-worker-canary-prep
    region: singapore
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev --ignore-scripts --audit=false --fund=false
    startCommand: npm run start:v4-canary-dry-run-host
    maxShutdownDelaySeconds: 60
    disk:
      name: datalab-v4-canary-data
      mountPath: /var/data/v4-canary
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        sync: false
      - key: V4_CANARY_DATA_DIR
        sync: false
      - key: V4_CANARY_MODE
        sync: false
      - key: V4_CANARY_APPROVAL_ID
        sync: false
      - key: V4_CANARY_EXTERNAL_CALLS_ENABLED
        sync: false
      - key: V4_CANARY_NETWORK_GATE_ENABLED
        sync: false
      - key: V4_CANARY_OPERATIONAL_PUBLISH_ENABLED
        sync: false
      - key: V4_CANARY_WEB_IMPORT_ENABLED
        sync: false
      - key: V4_CANARY_TIMEOUT_MS
        sync: false
      - key: V4_CANARY_MAX_RESPONSE_BYTES
        sync: false

# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Proposal only. Do not sync this Blueprint until Phase 3 deployment approval.
services:
  - type: worker
    name: datalab-v4-shadow-worker
    runtime: node
    repo: https://github.com/boader0914-bit/render
    branch: recovery/v4-worker-baseline
    region: singapore
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev --ignore-scripts --audit=false --fund=false
    startCommand: npm run start:v4-shadow
    maxShutdownDelaySeconds: 60
    disk:
      name: datalab-v4-shadow-data
      mountPath: /var/data/v4-worker
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "26.5.0"
      - key: NODE_ENV
        value: production
      - key: V4_WORKER_DATA_DIR
        value: /var/data/v4-worker
      - key: V4_SHADOW_MODE
        value: fixture
      - key: V4_EXTERNAL_CALLS_ENABLED
        value: "0"
      - key: V4_OPERATIONAL_PUBLISH_ENABLED
        value: "0"
      - key: V4_WEB_IMPORT_ENABLED
        value: "0"
      - key: V4_SHADOW_POLL_MS
        value: "1000"
      - key: V4_SHADOW_HEARTBEAT_MS
        value: "5000"
      - key: V4_SHADOW_LEASE_MS
        value: "30000"
      - key: V4_SHADOW_SHUTDOWN_GRACE_MS
        value: "30000"
      - key: V4_SHADOW_BOOTSTRAP_FIXTURE
        value: "1"
      - key: V4_SHADOW_BOOTSTRAP_ID
        value: phase3-shadow-001
      - key: V4_SHADOW_BOOTSTRAP_SCENARIO
        value: success
      - key: V4_WORKER_TIMEOUT_MS
        value: "1800000"
      - key: V4_WORKER_MAX_ARTIFACT_BYTES
        value: "524288000"
